[project]
name = "tasabido-backend"
version = "0.0.0"
description = "Tá Sabido backend — API de autenticação"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
    "pwdlib[argon2]==0.3.0",
    "pyjwt==2.13.0",
    "httpx==0.28.1",
    "phonenumbers==9.0.36",
    "validate-docbr==2.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
    "mypy==2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
